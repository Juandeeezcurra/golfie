name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (tools/fake-d1.mjs, el D1 simulado de los tests)
          # requiere 22.5+.
          node-version: '22'
      - name: Sintaxis de los módulos del cliente
        run: |
          for f in $(find public/js -name '*.js'); do node --check "$f"; done
      - name: Sintaxis del Worker
        run: |
          for f in $(find src -name '*.js'); do node --check "$f"; done
      - name: Tests
        run: npm test

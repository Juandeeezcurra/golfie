<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e4a20"/>
      <stop offset="100%" stop-color="#0b1e0c"/>
    </radialGradient>
    <radialGradient id="hillGrad" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#7ed44e"/>
      <stop offset="60%" stop-color="#5ab832"/>
      <stop offset="100%" stop-color="#3a8a1e"/>
    </radialGradient>
    <radialGradient id="hillSide" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#4ea828"/>
      <stop offset="100%" stop-color="#2d6e14"/>
    </radialGradient>
    <radialGradient id="flagGrad" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc1111"/>
    </radialGradient>
    <filter id="hillShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Hill dome top surface -->
  <ellipse cx="512" cy="640" rx="360" ry="200" fill="url(#hillGrad)" filter="url(#hillShadow)"/>

  <!-- Hill front face (slightly darker) -->
  <ellipse cx="512" cy="700" rx="360" ry="160" fill="url(#hillSide)"/>

  <!-- Hole in the green -->
  <ellipse cx="530" cy="618" rx="34" ry="22" fill="#0c1a0c"/>
  <ellipse cx="530" cy="614" rx="30" ry="18" fill="#0a1409"/>

  <!-- Flagpole -->
  <rect x="540" y="190" width="12" height="428" rx="6" fill="white"/>

  <!-- Waving flag -->
  <path d="M552 190 C600 200, 680 218, 720 240 C680 262, 600 278, 552 290 Z" fill="url(#flagGrad)"/>
  <path d="M552 190 C600 202, 680 220, 720 240 C700 245, 640 255, 600 258 C580 245, 560 225, 552 210 Z" fill="rgba(255,100,100,0.3)"/>

  <!-- Text GOLFIE -->
  <text x="512" y="870" font-family="'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="300" fill="white" text-anchor="middle" letter-spacing="28" opacity="0.95">GOLFIE</text>
</svg>
